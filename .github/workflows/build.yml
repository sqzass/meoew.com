name: Build All Platforms

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                os: [macos-latest, ubuntu-latest, windows-latest]
                include:
                    - os: macos-latest
                      platform: mac
                      artifact: meoew-mac
                    - os: ubuntu-latest
                      platform: linux
                      artifact: meoew-linux
                    - os: windows-latest
                      platform: windows
                      artifact: meoew-windows

        runs-on: ${{ matrix.os }}

        steps:
            - uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

            - name: Use Node.js 24
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm build

            # mac flags live only on the mac step: powershell mangles
            # dot-prefixed args. notarize/identity disabled: no Apple certs.
            - name: Package (linux)
              if: matrix.platform == 'linux'
              run: pnpm electron-builder --linux --publish never

            - name: Package (windows)
              if: matrix.platform == 'windows'
              run: pnpm electron-builder --windows --publish never

            - name: Package (mac)
              if: matrix.platform == 'mac'
              run: pnpm electron-builder --mac --publish never -c.mac.notarize=false -c.mac.identity=null

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.artifact }}
                  path: |
                      dist/*.AppImage
                      dist/*.tar.gz
                      dist/*.deb
                      dist/*.rpm
                      dist/*.exe
                      dist/*.zip
                      dist/*.dmg
                  if-no-files-found: error

    # single publisher avoids three jobs racing on one release
    nightly:
        needs: build
        runs-on: ubuntu-latest

        steps:
            - name: Remove previous nightly release
              run: gh release delete nightly --cleanup-tag --yes || true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO: ${{ github.repository }}

            - name: Download all artifacts
              uses: actions/download-artifact@v4
              with:
                  path: dist-all

            - name: Publish to nightly release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: nightly
                  name: nightly
                  body: |
                      automated grab-and-go build of main (${{ github.sha }}).

                      overwritten on every push.
                  make_latest: true
                  fail_on_unmatched_files: true
                  files: dist-all/**/*
